<!DOCTYPE html>  
<html lang="en">  
  
<head>  
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Admin Page</title>  
    <link rel="stylesheet" href="./home/home.css"> <!-- Link to the external CSS file for styling -->  
</head>  
  
<body>  
    <h1>Admin Page</h1> 
  
    <!-- Button to show the form for adding a new fundraiser -->  
    <button id="add-fundraiser-btn">Add Fundraiser</button>  
      
    <!-- Form container for adding a new fundraiser, initially hidden -->  
    <div id="add-fundraiser-form" style="display: none;">  
        <!-- Input fields for fundraiser details -->  
        <div>  
            <label>Organizer:</label><input type="text" id="organizer-input" /> 
        </div>  
        <div>  
            <label>Caption:</label><input type="text" id="caption-input" /> 
        </div>  
        <div>  
            <label>Target Funding:</label><input type="number" id="target-funding-input" /> 
        </div>  
        <div>  
            <label>Current Funding:</label><input type="number" id="current-funding-input" /> 
        </div>  
        <div>  
            <label>City:</label><input type="text" id="city-input" /> 
        </div>  
        <div>  
            <label>Active:</label>  
            <select id="active-input"> <!-- Dropdown to select if the fundraiser is active -->  
                <option value="1">True</option> <!-- Option to mark the fundraiser as active -->  
                <option value="2">False</option> 
            </select>  
        </div>  
        <div>  
            <label>Category:</label>  
            <select id="categoryId-input"> <!-- Dropdown to select the fundraiser category -->  
                <option value="1">People</option>  
                <option value="2">Society</option>
                <option value="3">Nature</option> 
                <option value="4">Disaster</option> 
                <option value="5">Culture</option> 
            </select>  
        </div>  
        <!-- Buttons to save or cancel the fundraiser addition -->  
        <button id="save-btn">Save</button> <!-- Saves the fundraiser details -->  
        <button id="cancel-add-btn">Cancel</button> <!-- Cancels the fundraiser addition process -->  
    </div>  
      
    <!-- Container to display the list of fundraisers -->  
    <div id="fundraisers-list"></div> <!-- This will be populated with fundraiser data via JavaScript -->  
  
    <!-- Link to the external JavaScript file for interactivity -->  
    <script src="./home/home.js"></script>  
</body>  
  
</html>
